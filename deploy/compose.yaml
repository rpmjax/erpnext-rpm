x-app: &app
  image: ${RPM_IMAGE:?Run deploy.sh build first}
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  environment:
    RPM_SITE: ${RPM_SITE:?Set RPM_SITE}
    FRAPPE_REDIS_CACHE: redis://redis-cache:6379
    FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
services:
  db:
    image: mariadb:11.8.6
    restart: unless-stopped
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
  init:
    <<: *app
    restart: 'no'
    command: [/home/frappe/frappe-bench/env/bin/python, /opt/rpm/init_site.py]
    environment:
      RPM_SITE: ${RPM_SITE:?Set RPM_SITE}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./init_site.py:/opt/rpm/init_site.py:ro
    secrets: [db_password, admin_password]
    depends_on:
      db: {condition: service_healthy}
      redis-cache: {condition: service_started}
      redis-queue: {condition: service_started}
    profiles: [setup]
  backend:
    <<: *app
    healthcheck:
      test: [CMD, /home/frappe/frappe-bench/env/bin/python, -c, "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/method/ping',headers={'X-Frappe-Site-Name':os.environ['RPM_SITE']}),timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
  websocket:
    <<: *app
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
  queue-short:
    <<: *app
    command: [bench, worker, --queue, "short,default"]
  queue-long:
    <<: *app
    command: [bench, worker, --queue, long]
  scheduler:
    <<: *app
    command: [bench, schedule]
  frontend:
    <<: *app
    command: [nginx-entrypoint.sh]
    ports: ['${RPM_BIND_IP:-127.0.0.1}:${RPM_PORT:-8085}:8080']
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${RPM_SITE:?Set RPM_SITE}
      CLIENT_MAX_BODY_SIZE: 50m
      PROXY_READ_TIMEOUT: '120'
    depends_on: [backend, websocket]
secrets:
  db_password:
    file: ${RPM_STATE_DIR:?Run configure}/db-password
  admin_password:
    file: ${RPM_STATE_DIR:?Run configure}/admin-password
volumes:
  sites:
  logs:
  db-data:
  redis-data:
