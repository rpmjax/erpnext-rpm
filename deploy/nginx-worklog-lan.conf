# Include inside nginx's http context (e.g. Ubuntu sites-enabled).
# Before enabling: disable the old server claiming 192.168.0.70:80.
# Docker frontend must remain bound to 127.0.0.1:8085.
map $http_upgrade $rpm_worklog_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name 192.168.0.70;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rpm_worklog_connection;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Identifies this gateway, not the installed application version.
        add_header X-RPM-Worklog-Gateway lan always;
    }
}
